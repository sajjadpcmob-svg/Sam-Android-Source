name: Build SAM APK (Offline AI / llama.cpp)

# OPTIONAL build that ALSO compiles the on-device llama.cpp engine into libsamllama.so
# (gated by the Gradle property -PsamLlama). It installs the Android NDK + CMake and lets
# CMake FetchContent pull the pinned llama.cpp tag from CMakeLists.txt.
#
# This is a SEPARATE workflow so the normal build-android.yml keeps producing an APK even if the
# native toolchain or the llama.cpp fetch has a problem. Run it manually when you want the
# offline-AI-capable APK. Device verification of inference still happens on a real phone.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-offline-ai:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install SDK packages (incl. NDK + CMake)
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973" "cmake;3.22.1"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Build debug APK with on-device LLM (-PsamLlama, with network retry)
        run: |
          set -e
          n=0
          until [ $n -ge 5 ]; do
            ./gradlew --no-daemon clean assembleDebug -PsamLlama && break
            n=$((n+1))
            echo "assembleDebug -PsamLlama attempt $n failed; retrying in 25s (helps only transient network/Gradle/llama.cpp fetch errors)"
            sleep 25
          done
          ls app/build/outputs/apk/debug/
      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: SAM-debug-apk-offline-ai
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
